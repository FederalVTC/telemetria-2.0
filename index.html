<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría 2.0 - FederalVTC</title>
    <!-- Fuente moderna e institucional -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #75aadb;
            --deep-blue: #1c3f60;
            --argentina-blue: #6cb4ee;
            --pure-white: #ffffff;
            --dark-bg: #0a1118;
            --panel-bg: rgba(12, 24, 38, 0.85);
            --accent-gold: #f4c430;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--pure-white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #152b42 0%, var(--dark-bg) 100%);
        }

        /* Contenedor principal con marco estilo fileteado moderno */
        .dashboard-container {
            width: 95%;
            max-width: 1200px;
            background: var(--panel-bg);
            border: 3px solid var(--sky-blue);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(117, 170, 219, 0.25), inset 0 0 15px rgba(108, 180, 238, 0.15);
            padding: 25px;
            position: relative;
        }

        /* Detalle ornamental simulando fileteado en las esquinas */
        .dashboard-container::before, .dashboard-container::after {
            content: "❖ ❖ ❖";
            position: absolute;
            color: var(--accent-gold);
            font-size: 14px;
            letter-spacing: 5px;
            left: 50%;
            transform: translateX(-50%);
        }
        .dashboard-container::before { top: 8px; }
        .dashboard-container::after { bottom: 8px; }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed var(--sky-blue);
            padding-bottom: 15px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--pure-white);
            text-shadow: 0 0 10px var(--argentina-blue);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--sky-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 5px;
        }

        /* Grilla de indicadores */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(10, 17, 24, 0.7);
            border: 1px solid var(--sky-blue);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(117, 170, 219, 0.05);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-gold);
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--sky-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--pure-white);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .card-unit {
            font-size: 0.9rem;
            color: var(--argentina-blue);
            margin-left: 4px;
        }

        /* Barra de estado inferior */
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(117, 170, 219, 0.3);
            font-size: 0.95rem;
        }

        .connected {
            color: #4ade80;
            font-weight: bold;
        }

        .disconnected {
            color: #f87171;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>FEDERAL VTC</h1>
            <div class="subtitle">Telemetría 2.0 • Edición Argentina</div>
        </header>

        <div class="grid-stats">
            <!-- Velocidad -->
            <div class="card">
                <div class="card-title">Velocidad</div>
                <div class="card-value"><span id="speed">0</span><span class="card-unit">km/h</span></div>
            </div>

            <!-- RPM -->
            <div class="card">
                <div class="card-title">Motor (RPM)</div>
                <div class="card-value"><span id="rpm">0</span></div>
            </div>

            <!-- Marcha -->
            <div class="card">
                <div class="card-title">Marcha</div>
                <div class="card-value" id="gear">N</div>
            </div>

            <!-- Combustible -->
            <div class="card">
                <div class="card-title">Combustible</div>
                <div class="card-value"><span id="fuel">0</span><span class="card-unit">L</span></div>
            </div>
        </div>

        <div class="status-bar">
            <div>Estado del Servidor: <span id="connection-status" class="disconnected">Desconectado</span></div>
            <div>Camión: <span id="truck-name">Esperando conexión...</span></div>
        </div>
    </div>

    <!-- Script de conexión con el Telemetry Server local de Funbit -->
    <script src="http://localhost:25555/scripts/ETS2Telemetry.js"></script>
    <script>
        // Conexión automática con el plugin local
        window.ets2.onDataReady = function(data) {
            // Estado de conexión
            document.getElementById('connection-status').innerText = "Conectado";
            document.getElementById('connection-status').className = "connected";

            // Datos del camión
            if (data.truck) {
                document.getElementById('speed').innerText = Math.round(data.truck.speed * 3.6); // m/s a km/h
                document.getElementById('rpm').innerText = Math.round(data.truck.engineRpm);
                
                let gearVal = data.truck.gear;
                if (gearVal === 0) gearVal = "N";
                else if (gearVal < 0) gearVal = "R";
                else gearVal = "M" + gearVal;
                document.getElementById('gear').innerText = gearVal;

                document.getElementById('fuel').innerText = Math.round(data.truck.fuel);
                
                if(data.truck.make && data.truck.model) {
                    document.getElementById('truck-name').innerText = data.truck.make + " " + data.truck.model;
                }
            }
        };

        window.ets2.onDisconnect = function() {
            document.getElementById('connection-status').innerText = "Desconectado (Abrir Ets2Telemetry.exe)";
            document.getElementById('connection-status').className = "disconnected";
        };
    </script>
</body>
</html>
